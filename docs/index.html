<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Envoyer un média</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f4f4f4}
h1{font-size:20px}
label{display:block;margin-top:14px;font-weight:bold}
input,button,textarea{width:100%;padding:12px;font-size:16px;box-sizing:border-box;margin-top:6px}
button{background:#1877f2;color:#fff;border:0;border-radius:8px}
#log{margin-top:16px;white-space:pre-wrap}
#res{display:none;margin-top:16px;background:#fff;padding:12px;border-radius:8px}
</style></head><body>
<h1>Envoyer une image ou une vidéo</h1>
<label>Jeton GitHub (gardé seulement dans ce téléphone)</label>
<input id="token" type="password" placeholder="github_pat_...">
<label>Fichier</label>
<input id="file" type="file" accept="image/*,video/*">
<button id="go">Envoyer</button>
<div id="log"></div>
<div id="res"><b>Fichier envoyé. Modifie si besoin, copie ce message et colle-le dans ChatGPT :</b>
<textarea id="msg" rows="6"></textarea><button id="copy">Copier</button></div>
<script>
var REPO='kidasniger/facebook-manager';
var $=function(i){return document.getElementById(i)};
$('token').value=localStorage.getItem('gh_token')||'';
function log(t){$('log').textContent=t}
$('go').onclick=function(){
  var tok=$('token').value.trim(), f=$('file').files[0];
  if(!tok){log('Colle ton jeton GitHub.');return}
  if(!f){log('Choisis un fichier.');return}
  if(f.size>50*1024*1024){log('Fichier trop gros (maximum 50 Mo).');return}
  localStorage.setItem('gh_token',tok);
  log('Lecture du fichier...');
  var r=new FileReader();
  r.onload=function(){
    var b64=r.result.split(',')[1];
    var name=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var path='media/'+name;
    log('Envoi en cours...');
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
      method:'PUT',
      headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'},
      body:JSON.stringify({message:'Ajout media '+name,content:b64})
    }).then(function(x){return x.json().then(function(j){return {ok:x.ok,j:j}})})
    .then(function(o){
      if(!o.ok){log('Erreur : '+(o.j.message||'inconnue'));return}
      log('Envoyé : '+path);
      var type=f.type.indexOf('video')===0?'vidéo':'image';
      var key=type==='vidéo'?'video_path':'image_path';
      $('msg').value="J'ai ajouté une "+type+" dans le dépôt : "+path+"\nRédige un texte pour le post et montre-le-moi. Après mon accord, publie-la via posts/avance.json avec "+key+".";
      $('res').style.display='block';
    }).catch(function(e){log('Erreur réseau : '+e)});
  };
  r.onerror=function(){log('Impossible de lire le fichier.')};
  r.readAsDataURL(f);
};
$('copy').onclick=function(){
  navigator.clipboard.writeText($('msg').value).then(function(){log('Message copié.')}).catch(function(){log('Copie impossible, copie le texte à la main.')});
};
</script></body></html>
