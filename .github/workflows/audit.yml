name: Audit complet
on:
  push:
    paths:
      - "audit/demande.json"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer les lectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in surveiller statistiques archiver archive-mensuelle; do
            gh workflow run "$w.yml" && echo "lance: $w"
            sleep 6
            id=$(gh run list --workflow="$w.yml" --limit 1 --json databaseId -q '.[0].databaseId')
            gh run watch "$id" --exit-status >/dev/null && echo "termine: $w" || echo "echec: $w"
          done
      - name: Signaler la fin
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull -q --rebase
          printf '{"termine":"%s","workflows":["surveiller","statistiques","archiver","archive-mensuelle"]}\n' "$(date -u +%FT%TZ)" > audit/resultat.json
          git add audit/resultat.json
          git commit -q -m "Audit termine"
          git push -q
