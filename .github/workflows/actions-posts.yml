name: Actions sur les posts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agir:
    # Inactif par défaut : GLM Live exécute cette file d'attente (évite les doublons).
    # Retour à l'ancien fonctionnement : variable Actions FILE_ATTENTE = workflows.
    if: vars.FILE_ATTENTE == 'workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: kidasniger/facebook-data
          token: ${{ secrets.DATA_PAT }}
          path: data
      - name: Exécuter les actions
        working-directory: data
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          f=posts/actions.json
          n=$(jq length $f)
          for i in $(seq 0 $((n-1))); do
            st=$(jq -r ".[$i].status" $f)
            if [ "$st" = "pending" ]; then
              act=$(jq -r ".[$i].action" $f)
              pid=$(jq -r ".[$i].post_id" $f)
              msg=$(jq -r ".[$i].message // empty" $f)
              if [ "$act" = "delete" ]; then
                res=$(curl -s -X DELETE "https://graph.facebook.com/v26.0/$pid" --data-urlencode "access_token=$FB_PAGE_TOKEN")
              elif [ "$act" = "edit" ]; then
                res=$(curl -s -X POST "https://graph.facebook.com/v26.0/$pid" --data-urlencode "message=$msg" --data-urlencode "access_token=$FB_PAGE_TOKEN")
              else
                res='{}'
              fi
              ok=$(echo "$res" | jq -r '.success // empty')
              if [ "$ok" = "true" ]; then s=done; else s=error; fi
              jq --argjson i "$i" --arg s "$s" '.[$i].status=$s' $f > /tmp/r.json && mv /tmp/r.json $f
            fi
          done
      - name: Enregistrer dans le dépôt privé
        uses: ./.github/actions/save-data
        with:
          paths: posts/actions.json
          message: "Actions exécutées"
