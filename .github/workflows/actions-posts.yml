name: Actions sur les posts
on:
  push:
    paths:
      - 'posts/actions.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exécuter les actions
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          f=posts/actions.json
          n=$(jq length $f)
          for i in $(seq 0 $((n-1))); do
            st=$(jq -r ".[$i].status" $f)
            if [ "$st" = "pending" ]; then
              act=$(jq -r ".[$i].action" $f)
              pid=$(jq -r ".[$i].post_id" $f)
              msg=$(jq -r ".[$i].message // empty" $f)
              if [ "$act" = "delete" ]; then
                res=$(curl -s -X DELETE "https://graph.facebook.com/v21.0/$pid" --data-urlencode "access_token=$FB_PAGE_TOKEN")
              elif [ "$act" = "edit" ]; then
                res=$(curl -s -X POST "https://graph.facebook.com/v21.0/$pid" --data-urlencode "message=$msg" --data-urlencode "access_token=$FB_PAGE_TOKEN")
              else
                res='{}'
              fi
              ok=$(echo "$res" | jq -r '.success // empty')
              if [ "$ok" = "true" ]; then s=done; else s=error; fi
              jq --argjson i "$i" --arg s "$s" '.[$i].status=$s' $f > /tmp/r.json && mv /tmp/r.json $f
            fi
          done
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posts/actions.json
          git diff --cached --quiet || (git commit -m "Actions exécutées" && git push)
