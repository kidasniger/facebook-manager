name: Verifier le jeton
on:
  workflow_dispatch:
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecter le jeton
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          curl -s -G "https://graph.facebook.com/v21.0/debug_token" --data-urlencode "input_token=$FB_PAGE_TOKEN" --data-urlencode "access_token=$FB_PAGE_TOKEN" | jq '.data | {type, is_valid, expires_at, data_access_expires_at, scopes}'
