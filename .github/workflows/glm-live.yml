name: Facebook Manager — Bot central

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/glm_manager.py"
      - "scripts/glm_boucle.py"
      - "scripts/comment_store.py"
      - "scripts/lecture_cache.py"
      - "scripts/lecture_messages.py"
      - "scripts/file_attente.py"
      - "scripts/taches_periodiques.py"
      - "scripts/aimes_auto.py"
      - "scripts/sante.py"
      - ".github/workflows/glm-live.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans publication (true ou false)"
        required: false
        default: "false"
      minutes:
        description: "Durée de session en minutes (330 en production)"
        required: false
        default: "330"

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    if: github.event_name == 'schedule' && vars.GLM_LIVE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier si le bot central tourne déjà
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actifs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow glm-live.yml --branch main --limit 100 --json status,event --jq '[.[] | select(.event != "schedule" and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested"))] | length')
          echo "Sessions bot actives ou en attente : $actifs"
          if [ "$actifs" -eq 0 ]; then
            echo "Aucune session active : démarrage du bot central."
            gh workflow run glm-live.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f minutes=330
          else
            echo "Le bot central est déjà actif."
          fi

  bot:
    if: github.event_name != 'schedule' && vars.GLM_LIVE != 'off'
    concurrency:
      group: facebook-comment-processing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      DUREE_MINUTES: ${{ github.event.inputs.minutes || '330' }}
      INTERVALLE_SECONDS: "60"
      BALAYAGE_MINUTES: ${{ vars.BALAYAGE_MINUTES || '20' }}
      STATS_HEURES: ${{ vars.STATS_HEURES || '6' }}
      MESSAGES_SECONDES: ${{ vars.MESSAGES_SECONDES || '120' }}
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données privées
        uses: actions/checkout@v4
        with:
          repository: kidasniger/facebook-data
          token: ${{ secrets.DATA_PAT }}
          path: data
      - name: Vérifier Python
        run: python3 --version
      - name: Exécuter le bot central
        id: boucle
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
        run: python3 scripts/glm_boucle.py
      - name: Relancer automatiquement la session suivante
        if: steps.boucle.outcome == 'success' && steps.boucle.outputs.relance != 'non' && env.DRY_RUN != '1' && vars.GLM_LIVE != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run glm-live.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f minutes=330
