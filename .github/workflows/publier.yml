name: Publier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publier:
    # Inactif par défaut : GLM Live exécute cette file d'attente (évite les doublons).
    # Retour à l'ancien fonctionnement : variable Actions FILE_ATTENTE = workflows.
    if: vars.FILE_ATTENTE == 'workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: kidasniger/facebook-data
          token: ${{ secrets.DATA_PAT }}
          path: data
      - name: Publier les posts en attente
        working-directory: data
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          FILE=posts/queue.json
          COUNT=$(jq length "$FILE")
          for i in $(seq 0 $((COUNT-1))); do
            [ "$(jq -r ".[$i].status" "$FILE")" != "pending" ] && continue
            MSG=$(jq -r ".[$i].message" "$FILE")
            RES=$(curl -s -X POST "https://graph.facebook.com/v26.0/$FB_PAGE_ID/feed" \
              --data-urlencode "message=$MSG" \
              --data-urlencode "access_token=$FB_PAGE_TOKEN")
            POST_ID=$(echo "$RES" | jq -r '.id // empty')
            if [ -n "$POST_ID" ]; then
              jq ".[$i].status=\"published\" | .[$i].post_id=\"$POST_ID\"" "$FILE" > tmp.json && mv tmp.json "$FILE"
            else
              echo "Erreur sur le post $i : $(echo "$RES" | jq -c '.error.message')"
              jq ".[$i].status=\"error\"" "$FILE" > tmp.json && mv tmp.json "$FILE"
            fi
          done
      - name: Enregistrer dans le dépôt privé
        uses: ./.github/actions/save-data
        with:
          paths: posts/queue.json
          message: "Mise à jour des posts"
