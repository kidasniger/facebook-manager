name: Assistant IA (relais du chat de l'application)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message isolé à traiter (mode suggestion). Vide = discussion glm/chat.json.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: assistant-chat
  cancel-in-progress: false

jobs:
  repondre:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les données (dépôt privé)
        uses: actions/checkout@v4
        with:
          repository: kidasniger/facebook-data
          token: ${{ secrets.DATA_PAT }}
          path: data

      - name: Répondre via Z.ai
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          INPUT_MESSAGE: ${{ github.event.inputs.message || '' }}
          DATA_DIR: ${{ github.workspace }}/data
        run: python3 scripts/assistant.py

      - name: Enregistrer dans le dépôt privé
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/data"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add glm/chat.json 2>/dev/null || true
          git add glm/reponse.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -q -m "Assistant IA"
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then echo "Enregistré dans le dépôt privé."; exit 0; fi
            sleep $((i * 4))
          done
          echo "Échec du push vers le dépôt de données."
          exit 1
