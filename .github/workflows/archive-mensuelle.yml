name: Archive mensuelle
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archiver:
    runs-on: ubuntu-latest
    steps:
      - name: Archiver la Page
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/kidasniger/facebook-archive.git" repo 2>/dev/null || { echo "ECHEC clone"; exit 1; }
          python3 - << 'PYEOF'
          import os, json, urllib.request, urllib.parse, datetime
          tok = os.environ["FB_PAGE_TOKEN"]
          pid = os.environ["FB_PAGE_ID"]
          G = "https://graph.facebook.com/v21.0/"
          def get(url):
              return json.load(urllib.request.urlopen(url, timeout=60))
          def pages(path, fields):
              url = G + path + "?" + urllib.parse.urlencode({"fields": fields, "limit": 50, "access_token": tok})
              out = []
              while url:
                  d = get(url)
                  out += d.get("data", [])
                  url = d.get("paging", {}).get("next")
              return out
          mois = datetime.datetime.utcnow().strftime("%Y-%m")
          base = "repo/" + mois
          os.makedirs(base + "/medias", exist_ok=True)
          posts = pages(pid + "/posts", "id,message,created_time,permalink_url,status_type,full_picture,attachments{media_type,url,media{source}},likes.summary(true).limit(0),shares")
          nc = 0
          nm = 0
          for p in posts:
              try:
                  p["commentaires"] = pages(p["id"] + "/comments", "id,message,created_time,from,like_count,comments{id,message,created_time,from}")
                  nc += len(p["commentaires"])
              except Exception:
                  p["commentaires"] = []
              src = None
              try:
                  for a in p.get("attachments", {}).get("data", []):
                      src = a.get("media", {}).get("source") or src
                  img = p.get("full_picture")
                  for url, ext in ((src, "mp4"), (img, "jpg")):
                      if url:
                          pth = "%s/medias/%s.%s" % (base, p["id"].replace("_", "-"), ext)
                          if not os.path.exists(pth):
                              urllib.request.urlretrieve(url, pth)
                              nm += 1
              except Exception:
                  pass
          with open(base + "/posts.json", "w", encoding="utf-8") as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          print("Posts:", len(posts), "| Commentaires:", nc, "| Medias:", nm)
          PYEOF
          cd repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "Archive $(date -u +%Y-%m)" && git push -q 2>/dev/null && echo "Archive enregistree"; }
