name: Diagnostic sécurisé du token Meta
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-token-meta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier les autorisations Meta sans exposer les secrets
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          version = "v26.0"
          vals = {k: os.environ.get(k, "") for k in ("FB_PAGE_TOKEN","FB_PAGE_ID","FB_APP_ID","FB_APP_SECRET")}
          missing = [k for k,v in vals.items() if not v]
          if missing:
              print("Secrets manquants:", ", ".join(missing)); sys.exit(1)
          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent":"KIDAS-Meta-Diagnostic/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except Exception: body={}
                  err=body.get("error",{}) if isinstance(body,dict) else {}
                  print("API HTTP",e.code,"code:",err.get("code","?"),"subcode:",err.get("error_subcode","?"))
                  return e.code,body
              except Exception as e:
                  print("Erreur réseau:",type(e).__name__); return 0,{}
          base=f"https://graph.facebook.com/{version}"
          q=urllib.parse.urlencode({"input_token":vals["FB_PAGE_TOKEN"],"access_token":vals["FB_APP_ID"]+"|"+vals["FB_APP_SECRET"]})
          status, debug=get_json(f"{base}/debug_token?{q}")
          d=debug.get("data",{}) if isinstance(debug,dict) else {}
          if status!=200 or not d:
              print("DIAGNOSTIC_TOKEN: IMPOSSIBLE"); sys.exit(1)
          scopes=d.get("scopes") or []
          print("TOKEN_VALIDE:", "OUI" if d.get("is_valid") is True else "NON")
          print("APP_ID_CORRESPOND:", "OUI" if str(d.get("app_id",""))==vals["FB_APP_ID"] else "NON")
          print("PAGES_MANAGE_ENGAGEMENT:", "OUI" if "pages_manage_engagement" in scopes else "NON")
          print("TYPE_TOKEN:",d.get("type","inconnu"))
          print("EXPIRATION_UNIX:",d.get("expires_at","inconnue"))
          print("SCOPES_RETOURNES:",", ".join(scopes) if scopes else "aucun")
          if d.get("is_valid") is not True:
              print("DIAGNOSTIC_FINAL: TOKEN_INVALIDE"); sys.exit(1)
          pq=urllib.parse.urlencode({"fields":"id,name,tasks","access_token":vals["FB_PAGE_TOKEN"]})
          ps,page=get_json(f'{base}/{urllib.parse.quote(vals["FB_PAGE_ID"],safe="")}?{pq}')
          if ps==200 and isinstance(page,dict):
              tasks=page.get("tasks")
              print("PAGE_ID_CORRESPOND:", "OUI" if str(page.get("id",""))==vals["FB_PAGE_ID"] else "NON")
              if isinstance(tasks,list):
                  print("CREATE_CONTENT:", "OUI" if "CREATE_CONTENT" in tasks else "NON")
                  print("TACHES_PAGE:",", ".join(tasks) if tasks else "aucune")
              else:
                  print("CREATE_CONTENT: NON_VERIFIABLE")
                  print("TACHES_PAGE: champ absent")
          else:
              print("PAGE_ID_CORRESPOND: NON_VERIFIABLE")
              print("CREATE_CONTENT: NON_VERIFIABLE")
          print("DIAGNOSTIC_FINAL: TERMINE")
          PY
