name: Test jeton archive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester l'écriture dans facebook-archive
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/kidasniger/facebook-archive.git" repo 2>/dev/null || { echo "ECHEC: clone impossible"; exit 1; }
          cd repo
          echo "test $(date -u +%F)" > test.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add test.txt
          git commit -m "Test jeton" >/dev/null
          git push >/dev/null 2>&1 && echo "OK: ecriture reussie" || { echo "ECHEC: ecriture refusee"; exit 1; }
